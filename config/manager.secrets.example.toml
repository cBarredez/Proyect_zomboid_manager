# Copy this file to manager.secrets.toml and set restrictive permissions:
#   cp config/manager.secrets.example.toml config/manager.secrets.toml
#   chmod 600 config/manager.secrets.toml
#
# manager.secrets.toml is gitignored and never copied into a container image.

[web]
password = "change-me"
# Generate with: node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
session_secret = "replace-with-a-random-64-char-hex-string"

[server]
# Used non-interactively on the first server start to create the built-in
# Project Zomboid "admin" account.
admin_password = "change-this-admin-password"
# Empty disables RCON.
rcon_password = "change-me-too"

[steam]
# Optional. SteamCMD can install the PZ dedicated server (app 380870) and
# download Workshop items anonymously; only set this if you need an
# authenticated Steam account for some other reason.
password = ""
